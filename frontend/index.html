<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Downloader Pro</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header>
        <div>
          <p class="eyebrow">YVD RUST</p>
          <h1>YouTube Downloader Pro</h1>
          <p class="subtitle">Queue downloads, pause safely, and resume from partial files.</p>
        </div>
        <div class="header-actions">
          <button id="check-updates" class="secondary">CHECK FOR UPDATES</button>
          <span id="status" class="status">READY</span>
        </div>
      </header>

      <section class="card">
        <label for="url">VIDEO OR PLAYLIST URL</label>
        <div class="input-row">
          <input id="url" type="url" placeholder="Paste a YouTube video or playlist URL" />
          <button id="add">PREVIEW MEDIA</button>
        </div>
        <p id="message" class="message"></p>
      </section>

      <section class="card">
        <div class="section-heading">
          <h2>DOWNLOAD SETTINGS</h2>
          <button id="save-settings" class="secondary">SAVE SETTINGS</button>
        </div>
        <div class="settings-grid">
          <label>OUTPUT DIRECTORY<input id="output-dir" type="text" placeholder="downloads" /></label>
          <label>VIDEO QUALITY<select id="quality">
            <option value="">Best available</option>
            <option value="2160">2160p</option>
            <option value="1440">1440p</option>
            <option value="1080">1080p</option>
            <option value="720">720p</option>
            <option value="480">480p</option>
          </select></label>
          <label class="checkbox"><input id="audio-only" type="checkbox" /> AUDIO ONLY (MP3)</label>
          <label class="checkbox"><input id="browser-cookies" type="checkbox" /> USE CHROME COOKIES</label>
          <label>MAX RETRIES<input id="max-retries" type="number" min="0" max="20" step="1" /></label>
        </div>
      </section>

      <section id="preview" class="card preview-card" hidden>
        <div class="section-heading">
          <h2>MEDIA PREVIEW</h2>
          <button id="clear-preview" class="secondary">CLEAR</button>
        </div>
        <div class="preview-content">
          <img id="thumbnail" alt="" />
          <div>
            <h3 id="preview-title"></h3>
            <p id="preview-channel" class="subtitle"></p>
            <p id="preview-details" class="subtitle"></p>
            <button id="add-preview">ADD THIS TO QUEUE</button>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="section-heading">
          <h2>DOWNLOAD QUEUE</h2>
          <button id="refresh" class="secondary">REFRESH</button>
        </div>
        <pre id="queue">Queue is empty.</pre>
      </section>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
