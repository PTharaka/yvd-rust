[package]
name = "yvd-rust"
version = "0.1.0"
edition = "2021"
description = "Rust download engine for YouTube Downloader Pro"
license = "MIT"

[lib]
name = "yvd_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "yvd-cli"
path = "src/main.rs"
